name: BuildTests
permissions:
  contents: read
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: 'pnpm'
          node-version: "${{ matrix.node-version }}"

      - name: allow write in work dir
        run: sudo chmod -R 777 .

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types

      - name: Run unit tests
        run: pnpm test:unit

      - name: Check package docs before build
        run: pnpm check-package-artifacts --allow-missing-dist

      - name: Building niconicomments
        run: pnpm build

      - name: Check package artifacts
        run: pnpm check-package-artifacts
