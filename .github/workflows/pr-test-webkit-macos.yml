name: WebKit macOS Tests
permissions:
  contents: read
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
concurrency:
  group: webkit-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 30
    # public リポジトリの標準 macOS runner は無料。
    # macOS のシステムフォント (Hiragino 等) でのみ再現する計測差を検証する。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: 'pnpm'
          node-version: 24

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm playwright install webkit

      - name: Building niconicomments
        run: pnpm build

      - name: Run WebKit tests
        run: pnpm playwright test -c playwright.webkit.config.ts
